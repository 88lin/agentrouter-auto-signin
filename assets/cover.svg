<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="AgentRouter Auto Signin — AgentRouter 每日自动签到">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#131A32"/>
      <stop offset="1" stop-color="#1D1339"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6EA8FE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.79" cy="0.44" r="0.44">
      <stop offset="0" stop-color="#7C6CF6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C6CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- 网格 -->
  <g stroke="#4C5A86" stroke-opacity="0.16" stroke-width="1">
    <path d="M0 100H1280M0 200H1280M0 300H1280"/>
    <path d="M160 0V400M320 0V400M480 0V400M640 0V400M800 0V400M960 0V400M1120 0V400"/>
  </g>

  <!-- 路由拓扑 -->
  <g fill="none" stroke="url(#accent)" stroke-width="2.2" stroke-opacity="0.75" stroke-linecap="round">
    <path d="M960 200L838 108"/>
    <path d="M960 200L1122 116"/>
    <path d="M960 200L1140 252"/>
    <path d="M960 200L1010 330"/>
    <path d="M960 200L846 300"/>
  </g>
  <circle cx="960" cy="200" r="66" fill="url(#coreGlow)"/>
  <circle cx="960" cy="200" r="22" fill="#A78BFA"/>
  <circle cx="960" cy="200" r="10" fill="#F5F3FF"/>
  <g fill="#0B1020" stroke="#8B9BE0" stroke-width="2">
    <circle cx="838" cy="108" r="9"/>
    <circle cx="1122" cy="116" r="7"/>
    <circle cx="1140" cy="252" r="8"/>
    <circle cx="1010" cy="330" r="6"/>
    <circle cx="846" cy="300" r="7"/>
  </g>
  <circle cx="960" cy="200" r="58" fill="none" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 9"/>

  <!-- 标题 -->
  <g font-family="'Segoe UI', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="84" y="152" font-size="74" font-weight="700" fill="#F8FAFC" letter-spacing="0.5">AgentRouter</text>
    <rect x="86" y="176" width="292" height="6" rx="3" fill="url(#accent)"/>
    <text x="84" y="240" font-size="30" font-weight="700" fill="url(#accent)" letter-spacing="7">AUTO SIGNIN</text>
    <text x="86" y="288" font-size="21" fill="#9AA8C7">每日自动签到 · 本地静默运行 · 多账号 · 微信推送</text>

    <!-- 标签 -->
    <g font-size="15" font-weight="600">
      <rect x="86" y="316" width="150" height="34" rx="17" fill="#6EA8FE" fill-opacity="0.14" stroke="#6EA8FE" stroke-opacity="0.45"/>
      <text x="161" y="338" fill="#A9C8FF" text-anchor="middle">Win / macOS</text>
      <rect x="248" y="316" width="122" height="34" rx="17" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.45"/>
      <text x="309" y="338" fill="#CBBDFF" text-anchor="middle">Python 3</text>
      <rect x="382" y="316" width="122" height="34" rx="17" fill="#F472B6" fill-opacity="0.14" stroke="#F472B6" stroke-opacity="0.45"/>
      <text x="443" y="338" fill="#F7BBD6" text-anchor="middle">MIT</text>
    </g>
  </g>
</svg>
